name: CI/CD Pipeline

'on':
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ghcr.io/${{ github.repository }}:latest
          APP_VERSION: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/soal-gamifikasi-flipbook' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE,APP_VERSION,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Sync repository compose files and config
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            # Check .env existence
            if [ ! -f .env ]; then
              echo "::error::.env file is missing in $DEPLOY_PATH"
              exit 1
            fi

            # Update image tag and version in .env
            grep -q '^APP_IMAGE=' .env \
              && sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env \
              || echo "APP_IMAGE=${APP_IMAGE}" >> .env

            SHORT_SHA="$(echo "$APP_VERSION" | cut -c1-7)"
            grep -q '^APP_VERSION=' .env \
              && sed -i "s|^APP_VERSION=.*|APP_VERSION=${SHORT_SHA}|" .env \
              || echo "APP_VERSION=${SHORT_SHA}" >> .env

            # Authenticate to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull latest image & restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Health check loop
            echo "Waiting for flipbook-app to answer on 127.0.0.1:8085..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8085/health.php > /dev/null 2>&1; then
                echo "Healthy after $((i * 2))s"
                docker logout ghcr.io || true
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "::error::Application failed health check within 60s"
            docker compose ps
            docker compose logs --tail=50 app
            docker logout ghcr.io || true
            exit 1

