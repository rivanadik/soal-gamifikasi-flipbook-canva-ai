<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bab 4 – Editing Video dengan Canva</title>
<style>
:root{--bg:#FFF8E7;--tx:#0F2747;--pr:#1E5AA8;--ac:#FFC93C;--cd:#fff;--ln:#dccfa6;--ok:#2FA84F;--bad:#E5484D;--mu:#5a6b85;--pn:#12233D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1626;--tx:#f3efe0;--cd:#16263f;--ln:#2c4163;--mu:#9db0cc;--pr:#5b9bf0}}
:root[data-theme="dark"]{--bg:#0c1626;--tx:#f3efe0;--cd:#16263f;--ln:#2c4163;--mu:#9db0cc;--pr:#5b9bf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Nunito,Quicksand,ui-rounded,system-ui,sans-serif}
#app{max-width:560px;margin:auto;padding:14px 14px 40px}
h1{font-size:25px;line-height:1.2;margin:8px 0}
.hero{text-align:center;padding:10px 0}.kl{width:96px}
.card{background:var(--cd);border:2px solid var(--ln);border-radius:20px;padding:16px;margin:12px 0}
label{font-weight:800}
input{width:100%;font:inherit;padding:14px;border-radius:14px;border:3px solid var(--ln);background:var(--bg);color:var(--tx);margin:8px 0}
input:focus{outline:none;border-color:var(--pr)}
.hint{color:var(--mu);font-size:16px;min-height:24px}
.btn,.big{display:block;width:100%;min-height:54px;border:0;border-radius:18px;font:inherit;font-weight:800;padding:12px 16px;margin:10px 0;cursor:pointer;color:var(--tx)}
.btn:disabled{opacity:.4}
.pr{background:var(--pr);color:#fff}.ac{background:var(--ac);color:#0F2747}.ln{background:transparent;border:3px solid var(--ln)}
.big{text-align:left;padding:20px;font-size:21px;box-shadow:0 6px 0 rgba(0,0,0,.18)}.big span{display:block;font-size:16px;font-weight:600;opacity:.9}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:800}
.back{background:none;border:2px solid var(--ln);border-radius:12px;padding:8px 12px;font:inherit;color:var(--tx);cursor:pointer;min-height:44px}
.film{display:flex;gap:4px;margin:14px 0;background:var(--pn);padding:6px;border-radius:10px}
.film i{flex:1;height:14px;border-radius:3px;background:#2d4466}.film .f{background:var(--ok)}.film .c{background:var(--ac)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;background:var(--cd);color:var(--tx);border:3px solid var(--ln);border-radius:16px;padding:12px;margin:8px 0;min-height:54px;cursor:pointer}
.opt b{background:var(--pr);color:#fff;border-radius:10px;min-width:34px;height:34px;display:grid;place-items:center}
.opt.ok{border-color:var(--ok);background:rgba(47,168,79,.18);animation:pop .4s}.opt.ok b{background:var(--ok)}
.opt.bad{border-color:var(--bad);animation:shk .4s;opacity:.6}
.fb{background:var(--cd);border-left:6px solid var(--ac);border-radius:12px;padding:10px 14px;margin:10px 0;min-height:24px}
.fb:empty{display:none}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shk .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed var(--ln);border-radius:14px}
.chip{background:var(--ac);color:#0F2747;font-weight:800;border-radius:12px;padding:10px 14px;cursor:grab;touch-action:none;user-select:none}
.drag{touch-action:none;user-select:none}.sel{outline:4px solid var(--pr)}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:rotate(-3deg)}
.ed{background:var(--pn);border-radius:16px;padding:10px;color:#fff}
.cv{height:92px;border-radius:10px;background:linear-gradient(135deg,#1E5AA8,#2c7fd6);position:relative;margin-bottom:8px;display:grid;place-items:center}
.tl{background:#0b1830;border-radius:10px;position:relative;padding:4px 4px 6px}
.ruler{height:28px;display:flex;align-items:center;font-size:12px;opacity:.9;background:repeating-linear-gradient(90deg,#5b7399 0 1px,transparent 1px 12.5%);padding-left:56px}
.tr{height:40px;margin-top:4px;background:#17294a;border-radius:8px;position:relative;display:flex;align-items:center;padding-left:4px}
.slot{min-width:50px;height:30px;border:2px dashed #7f95b8;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 4px;z-index:3;background:#0b1830;white-space:nowrap}
.slot.on{border:2px solid var(--ok);background:var(--ok);color:#fff}
.cl{position:absolute;top:6px;height:28px;border-radius:7px;opacity:.85}
.ph{position:absolute;left:62%;top:0;bottom:0;width:30px;margin-left:-15px;z-index:2;display:flex;flex-direction:column;align-items:center}
.ph::after{content:"";flex:1;width:3px;background:var(--bad)}
.ph .slot{position:absolute;top:28px;left:34px;width:auto}
.zone.over{outline:3px solid var(--ac)}
.sl2{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--pn);padding:8px;border-radius:12px;position:relative}
.sl2 .zone{min-height:92px;border:2px dashed #7f95b8;border-radius:8px;display:grid;place-items:center;color:#9db0cc;font-size:12px;font-weight:800}
.sl2 .zone.bad{border-color:var(--bad);animation:shk .4s}
.c2{background:var(--cd);color:var(--tx);border-radius:10px;padding:4px;text-align:center;font-size:11px;line-height:1.2;cursor:grab;margin:2px;width:100%}
.c2 svg{width:100%;border-radius:6px}.c2 b{display:block;font-size:12px}
#tray2{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
#pp{position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--bad);display:none}
.bar3{position:relative;height:64px;background:var(--pn);border-radius:12px;margin:14px 0 30px;touch-action:none}
.clip{position:absolute;top:10px;height:44px;background:var(--pr);border:2px solid #fff;border-radius:8px}
.h3{position:absolute;top:2px;width:28px;height:60px;margin-left:-14px;background:var(--ac);border-radius:9px;touch-action:none;cursor:ew-resize;z-index:2}
.h3.p{background:var(--bad);width:14px;margin-left:-7px}
.tk{position:absolute;bottom:-22px;font-size:12px;color:var(--mu);transform:translateX(-50%)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:120px}
.lv{display:flex;align-items:center;gap:12px;text-align:left}.lv i{font-style:normal;font-size:30px}
.lock{opacity:.45}
code,.code{display:block;background:var(--bg);border:2px dashed var(--ln);border-radius:12px;padding:10px;word-break:break-all;font:14px ui-monospace,monospace}
ul{padding-left:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
// ===== Pengaturan server (opsional). Isi jika memakai Supabase (lihat berkas SQL). Kosong = mode luring. =====
const CFG={URL:"",KEY:""};
const $=s=>document.querySelector(s),A=$('#app'),L='ABCDE';
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const K='b4_';function ls(g,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(K+g));localStorage.setItem(K+g,JSON.stringify(v))}catch(e){return null}}
let users=ls('users')||{},prog=ls('prog')||{},U=null,sel=null;
const norm=s=>s.trim().replace(/\s+/g,' ');
const valid=s=>/^[A-Za-z]+( [A-Za-z]+)*$/.test(s)&&s.length>=3&&s.length<=40;
const bd=s=>s>=85?'Emas':s>=60?'Perak':'Perunggu';
async function rpc(n,b){const r=await fetch(CFG.URL+'/rest/v1/rpc/'+n,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.KEY,Authorization:'Bearer '+CFG.KEY},body:JSON.stringify(b)});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null}
async function daftar(n){if(CFG.URL){try{return await rpc('daftar_siswa',{p_nama:n})}catch(e){throw new Error(/NAMA_SUDAH_ADA/.test(e.message)?'dup':'bad')}}const k=n.toLowerCase();if(users[k])throw new Error('dup');users[k]=n;ls('users',users);return k}
async function masuk(n){if(CFG.URL){try{return await rpc('masuk_siswa',{p_nama:n})}catch(e){throw new Error('nf')}}const k=n.toLowerCase();if(!users[k])throw new Error('nf');return k}
async function simpan(d){const p=prog[U.id]=prog[U.id]||{q:0,g:{}};if(d.jenis=='kuis')p.q=Math.max(p.q,d.skor);else p.g[d.level]=Math.max(p.g[d.level]||0,d.skor);ls('prog',prog);
if(CFG.URL){try{await rpc('simpan_progres',{p_siswa:U.id,p_bab:4,p_jenis:d.jenis,p_level:d.level||null,p_skor:d.skor,p_lencana:d.lencana||null,p_ulang:d.ulang||''})}catch(e){}}}
const gt=()=>{const p=prog[U.id]||{g:{}};return[1,2,3].reduce((a,l)=>a+(p.g[l]||0),0)};
const kode=()=>`${U.name}|B4|KUIS:${(prog[U.id]||{q:0}).q}|GAME:${gt()}|${new Date().toISOString().slice(0,10)}`;
const klipi=()=>`<svg class="kl" viewBox="0 0 80 64"><rect x="6" y="14" width="54" height="40" rx="10" fill="#1E5AA8"/><path d="M60 28l16-9v28l-16-9z" fill="#FFC93C"/><circle cx="24" cy="34" r="8" fill="#fff"/><circle cx="24" cy="34" r="3.5" fill="#0F2747"/><circle cx="44" cy="34" r="8" fill="#fff"/><circle cx="44" cy="34" r="3.5" fill="#0F2747"/><path d="M26 47q8 5 16 0" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="14" y="4" width="14" height="10" rx="3" fill="#FFC93C"/><rect x="34" y="4" width="14" height="10" rx="3" fill="#FFC93C"/></svg>`;
const medal=s=>{const c={Emas:'#FFC93C',Perak:'#B8C0CC',Perunggu:'#CD7F32'}[bd(s)];return`<svg viewBox="0 0 64 80" width="96"><path d="M18 0h12l6 26H24zM46 0H34l-6 26h12z" fill="#E5484D"/><circle cx="32" cy="50" r="24" fill="${c}"/><circle cx="32" cy="50" r="17" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/><text x="32" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#0F2747">★</text></svg>`};
const bar=t=>`<div class="top"><button class="back" onclick="menu()">← Kembali ke menu</button><span>${t}</span></div>`;
const off=()=>CFG.URL?'':'<p class="hint">Mode luring: progres tersimpan di perangkat ini saja.</p>';
const say=t=>{const f=$('#fb');if(f)f.textContent=t};
const show=h=>{sel=null;A.innerHTML=h;scrollTo(0,0)};
const uniq=a=>[...new Set(a)];
const weakBox=w=>`<div class="card"><b>Materi yang perlu diulang</b>${w.length?'<ul>'+uniq(w).map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p>Hebat! Tidak ada materi yang perlu diulang.</p>'}</div>`;
const finBox=(s,w,again)=>`<div class="hero">${medal(s)}<h1>Lencana ${bd(s)}</h1><h1>Skor: ${s}</h1></div>${weakBox(w)}<div class="card"><b>Tunjukkan layar ini ke gurumu</b><p>${U.name}</p><span class="code" id="kd">${kode()}</span><button class="btn ln" onclick="cp()">Salin Kode Progres</button></div><button class="btn pr" onclick="${again}">Ulangi</button><button class="btn ln" onclick="menu()">Kembali ke menu</button>${off()}`;
function cp(){try{navigator.clipboard.writeText($('#kd').textContent);alert('Kode disalin')}catch(e){alert('Salin manual kode di layar')}}

// ===== Gerbang nama =====
function gate(){show(`<div class="hero">${klipi()}<h1>Bab 4<br>Editing Video dengan Canva</h1><p>Halo! Tulis namamu dulu ya.</p></div><div class="card"><label for="nm">Tulis namamu</label><input id="nm" autocomplete="off" maxlength="40" placeholder="Contoh: Dimas Pratama"><div id="msg" class="hint">Nama hanya boleh huruf dan spasi.</div><button id="go" class="btn pr" disabled>Mulai</button><button id="ct" class="btn ln">Lanjutkan (aku sudah pernah daftar)</button></div>${off()}`);
const nm=$('#nm'),msg=$('#msg');nm.oninput=()=>{const b=nm.value;let v=b.replace(/[^A-Za-z ]/g,'').replace(/ {2,}/g,' ').replace(/^ /,'');nm.value=v;msg.textContent=b!==v?'Nama hanya boleh huruf dan spasi.':(v&&!valid(norm(v))?'Minimal 3 huruf.':'Nama hanya boleh huruf dan spasi.');$('#go').disabled=!valid(norm(v))};
const run=async f=>{const n=norm(nm.value);if(!valid(n)){msg.textContent='Tulis nama yang valid dulu ya (huruf saja, minimal 3).';return}try{U={name:n,id:await f(n)};menu()}catch(e){msg.textContent=e.message=='dup'?'Nama ini sudah dipakai. Tambahkan nama belakang atau inisial huruf, misalnya Dimas Pratama.':e.message=='nf'?'Nama belum terdaftar. Tekan Mulai untuk mendaftar.':'Nama tidak valid.'}};
$('#go').onclick=()=>run(daftar);$('#ct').onclick=()=>run(masuk)}
function menu(){const p=prog[U.id]||{q:0,g:{}};show(`<div class="hero">${klipi()}<h1>Halo, ${U.name}!</h1><p>Pilih kegiatanmu.</p></div><button class="big pr" onclick="quiz()">Kuis<span>10 soal pilihan ganda · skor terbaik ${p.q}</span></button><button class="big ac" onclick="gmap()">Game: Studio Timeline<span>3 level · skor ${gt()}/100</span></button>${off()}`)}

// ===== Kuis =====
const Q=[
{q:'Bagian editor video tempat klip, teks, dan audio disusun sepanjang waktu disebut ….',o:['kanvas','palet warna','galeri template','timeline','brand kit'],k:3,m:'Antarmuka editor (timeline)',h:'Bayangkan garis waktu tempat semua lapisan berjajar dari kiri ke kanan.',e:'Timeline adalah tempat klip, teks, dan audio diatur menurut waktu.'},
{q:'Klip yang diletakkan pada main track akan diputar ….',o:['bersamaan dengan semua klip lain','berurutan tanpa jeda','hanya jika diberi transisi','secara acak','tanpa suara'],k:1,m:'Main track',h:'Main track adalah jalur utama. Pikirkan bagaimana film menyambung adegan satu per satu.',e:'Klip di main track tersambung berurutan tanpa jeda.'},
{q:'Agar teks tampil di atas video sebagai lapisan tambahan, teks diletakkan pada ….',o:['upper track','audio track','main track','halaman cover','jalur ekspor'],k:0,m:'Upper track',h:'Lapisan di atas video utama punya nama yang menyiratkan posisinya.',e:'Upper track menampung elemen yang menumpuk di atas main track.'},
{q:'Memangkas bagian awal atau akhir klip dengan menyeret tepinya disebut ….',o:['duplicate','merge','overlay','crop warna','trim'],k:4,m:'Trim',h:'Kata ini berarti memangkas. Kamu hanya menggeser tepi klip, klipnya tidak terbelah.',e:'Trim memendekkan klip dari awal atau akhir.'},
{q:'Untuk membelah satu klip menjadi dua bagian pada posisi playhead digunakan fitur ….',o:['Detach','Animate','Split','Preview','Resize'],k:2,m:'Split',h:'Kamu butuh dua bagian dari satu klip. Cari fitur yang artinya membelah.',e:'Split membelah klip tepat di posisi playhead.'},
{q:'Efek perpindahan dari satu klip ke klip berikutnya diatur pada panel ….',o:['Uploads','Text','Audio','Transitions','Brand Kit'],k:3,m:'Transisi',h:'Cari panel yang namanya sama dengan efek perpindahan antarklip.',e:'Panel Transitions berisi efek perpindahan antarklip.'},
{q:'Seorang desainer ingin membuat suara narasi dari teks tanpa merekam suara. Pilihan yang tepat pada menu audio Canva adalah ….',o:['Generate AI voice','Set video as background','Add transition','Duplicate','Preview'],k:0,m:'Audio dan AI voice',h:'Kamu tidak merekam suara, jadi cari opsi yang menghasilkan suara buatan.',e:'Generate AI voice mengubah teks menjadi suara narasi.'},
{q:'Format unduhan yang tepat untuk desain berisi video dan musik adalah ….',o:['PNG','JPG','MP4 Video','PDF','PPTX'],k:2,m:'Ekspor video',h:'Desain yang bergerak dan bersuara butuh format video, bukan gambar atau dokumen.',e:'MP4 Video menyimpan gambar bergerak beserta suaranya.'},
{q:'Pada akun gratis, video MP4 dapat diunduh dengan resolusi maksimal ….',o:['640 × 360','1920 × 1080','2560 × 1440','3840 × 2160','4096 × 2304'],k:1,m:'Resolusi ekspor',h:'Bukan yang paling kecil, dan bukan ukuran 2K atau 4K. Cari yang dikenal sebagai Full HD.',e:'Akun gratis dibatasi sampai Full HD, yaitu 1920 × 1080.'},
{q:'Sebelum menggunakan musik berbayar pada video yang akan diunggah ke media sosial, hal yang paling penting dilakukan adalah ….',o:['memperbesar volume musik','mengganti nama berkas video','memotong musik menjadi lebih pendek','menghapus seluruh teks pada video','memastikan lisensi penggunaan musik tersebut'],k:4,m:'Lisensi musik',h:'Musik berbayar milik orang lain. Apa yang harus dipastikan sebelum video tayang untuk umum?',e:'Lisensi menentukan boleh atau tidaknya musik dipakai di media sosial.'}];
let Z;
function quiz(){Z={o:shuf(Q.map((_,i)=>i)),i:0,sc:0,w:[]};qs()}
function qs(){const q=Q[Z.o[Z.i]];Z.t=0;Z.d=0;Z.x=[];
show(`${bar('Kuis '+(Z.i+1)+'/10')}<div class="film">${Q.map((_,i)=>`<i class="${i<Z.i?'f':i==Z.i?'c':''}"></i>`).join('')}</div><div class="card"><b>${q.q}</b></div>${q.o.map((t,j)=>`<button class="opt" id="o${j}" onclick="pick(${j})"><b>${L[j]}</b><span>${t}</span></button>`).join('')}<div class="fb" id="fb"></div><div id="nx"></div>`)}
function pick(j){const q=Q[Z.o[Z.i]];if(Z.d||Z.x.includes(j))return;const b=$('#o'+j);
if(j==q.k){b.classList.add('ok');Z.sc+=Z.t?5:10;qf(q,'Benar! ')}
else{b.classList.add('bad');b.disabled=true;Z.x.push(j);if(!Z.t){Z.t=1;say('Belum tepat. Petunjuk: '+q.h+' Coba sekali lagi!')}else{$('#o'+q.k).classList.add('ok');Z.w.push(q.m);qf(q,'Jawaban yang benar: '+L[q.k]+'. ')}}}
function qf(q,p){Z.d=1;say(p+q.e);$('#nx').innerHTML=`<button class="btn pr" onclick="qn()">${Z.i<9?'Lanjut':'Lihat hasil'}</button>`}
async function qn(){if(Z.i<9){Z.i++;qs();return}await simpan({jenis:'kuis',skor:Z.sc,lencana:bd(Z.sc),ulang:uniq(Z.w).join('; ')});show(bar('Hasil kuis')+finBox(Z.sc,Z.w,'quiz()'))}

// ===== Pembantu seret-lepas (seret atau ketuk lalu ketuk tujuan) =====
function dnd(root,drop){root.querySelectorAll('.drag').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();const r=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;let g=null;
const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g)}if(g){g.style.left=ev.clientX-r.width/2+'px';g.style.top=ev.clientY-20+'px'}};
const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(g){g.remove();const z=document.elementFromPoint(ev.clientX,ev.clientY);const zz=z&&z.closest('.zone');if(zz)drop(el.dataset.id,zz)}else{sel=sel===el.dataset.id?null:el.dataset.id;root.querySelectorAll('.drag').forEach(x=>x.classList.toggle('sel',x.dataset.id===sel))}};
addEventListener('pointermove',mv);addEventListener('pointerup',up)}});
root.querySelectorAll('.zone').forEach(z=>z.onclick=e=>{if(sel&&!e.target.closest('.drag')){e.stopPropagation();const s=sel;sel=null;drop(s,z)}})}

// ===== Game =====
const Wk={1:[],2:[],3:[]};
function gmap(){const p=prog[U.id]||{g:{}},d=l=>p.g[l]!==undefined,nm=['Kenali Editor','Susun Storyboard','Trim dan Split'],mx=[30,30,40];
show(`${bar('Studio Timeline')}<div class="hero">${klipi()}<p>Klipi diminta membuat video promosi sekolah. Bantu dia lewat 3 level!</p></div>${[1,2,3].map(l=>{const ok=l==1||d(l-1);return`<button class="big ${d(l)?'ac':'pr'} ${ok?'':'lock'}" ${ok?`onclick="L${l}()"`:'disabled'}><span class="lv"><i>${ok?(d(l)?'✔':'▶'):'🔒'}</i><b>Level ${l} – ${nm[l-1]}<span>${d(l)?'Skor '+p.g[l]+'/'+mx[l-1]:ok?'Siap dimainkan':'Selesaikan level sebelumnya'}</span></b></span></button>`}).join('')}${d(3)?'<button class="btn pr" onclick="gfin()">Lihat hasil akhir</button>':''}${off()}`)}
function gfin(){show(bar('Hasil game')+finBox(gt(),[...Wk[1],...Wk[2],...Wk[3]],'gmap()'))}
const lvEnd=(l,s,w)=>{simpan({jenis:'game',level:l,skor:s,ulang:uniq(w).join('; ')});$('#end').innerHTML=`<div class="card"><b>Level ${l} selesai! Skor ${s}</b><button class="btn pr" onclick="gmap()">Lanjut</button><button class="btn ln" onclick="L${l}()">Ulangi level</button></div>`};

// Level 1
const N1={kanvas:'Kanvas',timeline:'Timeline',main:'Main track',upper:'Upper track',audio:'Audio track',playhead:'Playhead'};
const H1={kanvas:'Ini area tempat kamu melihat pratinjau hasil desain atau videonya.',timeline:'Ini seluruh panel tempat klip, teks, dan audio berjajar menurut waktu.',main:'Ini jalur utama tempat klip video disambung berurutan.',upper:'Ini jalur lapisan tambahan yang menumpuk di atas video utama, cocok untuk teks.',audio:'Ini jalur yang menampilkan gelombang suara musik atau narasi.',playhead:'Ini garis merah yang menunjukkan detik yang sedang ditampilkan.'};
let G1;
function L1(){G1={a:{},d:{},p:0,w:[]};const s=k=>`<b class="slot" id="s-${k}">?</b>`;
show(`${bar('Level 1')}<p><b>Kenali Editor.</b> Seret label ke bagian yang tepat (atau ketuk label, lalu ketuk bagiannya).</p><div class="chips">${shuf(Object.keys(N1)).map(k=>`<div class="chip drag" data-id="${k}">${N1[k]}</div>`).join('')}</div><div class="fb" id="fb"></div>
<div class="ed"><div class="zone cv" data-z="kanvas">${s('kanvas')}</div><div class="zone tl" data-z="timeline"><div class="ruler">${s('timeline')}<span style="margin-left:10px">0 dtk ──────── 20 dtk</span></div>
<div class="zone tr" data-z="upper">${s('upper')}<div class="cl" style="left:35%;width:30%;background:#E8A317"></div></div>
<div class="zone tr" data-z="main">${s('main')}<div class="cl" style="left:22%;width:25%;background:#2c7fd6"></div><div class="cl" style="left:48%;width:30%;background:#4ba0f0"></div></div>
<div class="zone tr" data-z="audio">${s('audio')}<div class="cl" style="left:22%;width:70%;background:#2FA84F;opacity:.6"></div></div>
<div class="zone ph" data-z="playhead">${s('playhead')}</div></div></div><div id="end"></div>`);dnd(A,d1)}
function d1(id,z){const k=z.dataset.z;if(G1.d[id]||!k)return;const n=G1.a[id]=(G1.a[id]||0)+1;
const pl=p=>{G1.d[id]=1;G1.p+=p;sel=null;const e=$('#s-'+id);e.textContent=N1[id];e.classList.add('on');const c=A.querySelector('.drag[data-id="'+id+'"]');if(c)c.remove();if(Object.keys(G1.d).length==6)lvEnd(1,G1.p,G1.w)};
if(id==k){say('Tepat!');pl(n==1?5:2)}else{z.classList.add('shake');setTimeout(()=>z.classList.remove('shake'),400);if(n>=2){G1.w.push('Bagian editor: '+N1[id]);Wk[1].push('Bagian editor: '+N1[id]);say('Ini tempatnya. '+H1[id]);pl(0)}else say('Belum tepat. Petunjuk: '+H1[id])}}

// Level 2
const SC=[['Pembuka','Gerbang sekolah dan sapaan','3 dtk','Penonton perlu tahu siapa kita dulu.'],['Kegiatan','Siswa belajar dan praktik','5 dtk','Perlihatkan dulu apa yang dikerjakan siswa sebelum memamerkan hasilnya.'],['Karya','Poster dan video karya siswa','5 dtk','Karya adalah bukti dari kegiatan, jadi ia datang setelahnya.'],['Ajakan','“Ayo bergabung di jurusan DKV!”','3 dtk','Ajakan paling kuat muncul setelah penonton terkesan.'],['Logo dan alamat','Logo dan alamat sekolah','4 dtk','Penutup yang mudah diingat: identitas sekolah ada di akhir.']];
const svg2=i=>{const c=['#9ad1f5','#ffd98a','#c5b3f0','#ffb4a2','#a8e6b8'][i],b=['<rect x="14" y="14" width="32" height="22" fill="#1E5AA8"/><rect x="26" y="22" width="8" height="14" fill="#FFC93C"/>','<circle cx="20" cy="22" r="5" fill="#0F2747"/><circle cx="40" cy="22" r="5" fill="#0F2747"/><rect x="12" y="29" width="36" height="6" fill="#1E5AA8"/>','<rect x="10" y="6" width="18" height="26" fill="#fff"/><rect x="32" y="10" width="18" height="18" fill="#1E5AA8"/>','<rect x="8" y="12" width="44" height="5" rx="2" fill="#0F2747"/><rect x="8" y="22" width="30" height="5" rx="2" fill="#0F2747"/><path d="M42 24l8 4-8 4z" fill="#E5484D"/>','<circle cx="30" cy="16" r="10" fill="#1E5AA8"/><rect x="14" y="31" width="32" height="4" rx="2" fill="#0F2747"/>'][i];return`<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="${c}"/>${b}</svg>`};
let G2;
function L2(){G2={o:shuf([0,1,2,3,4]),sl:[null,null,null,null,null],n:0};r2()}
function r2(){const cd=i=>`<div class="c2 drag" data-id="${i}">${svg2(i)}<b>${SC[i][0]}</b>${SC[i][1]} · ${SC[i][2]}</div>`;
show(`${bar('Level 2')}<p><b>Susun Storyboard.</b> Seret kartu adegan ke main track sesuai alur cerita video promosi sekolah.</p><div class="zone" data-z="tray"><div id="tray2" class="chips">${G2.o.filter(i=>!G2.sl.includes(i)).map(cd).join('')}</div></div><div class="fb" id="fb"></div><div class="sl2" id="main2">${G2.sl.map((c,i)=>`<div class="zone" data-z="${i}">${c===null?'Slot '+(i+1):cd(c)}</div>`).join('')}<div id="pp"></div></div><button class="btn pr" id="pl" onclick="c2()" ${G2.sl.includes(null)?'disabled':''}>▶ Putar Video</button><div id="end"></div>`);dnd(A,(id,z)=>{id=+id;const t=z.dataset.z;G2.sl=G2.sl.map(x=>x===id?null:x);if(t!='tray')G2.sl[+t]=id;r2()})}
function c2(){const n=++G2.n,bad=G2.sl.map((c,i)=>c===i?-1:i).filter(i=>i>=0);
if(!bad.length){$('#pl').disabled=true;const p=$('#pp');p.style.display='block';p.animate([{left:'0%'},{left:'99%'}],{duration:2400});say('Memutar video…');setTimeout(()=>{p.style.display='none';say('Alurnya enak ditonton!');lvEnd(2,n==1?30:15,Wk[2])},2400);return}
const zs=A.querySelectorAll('#main2 .zone');bad.forEach(i=>zs[i].classList.add('bad'));
if(n>=2){Wk[2].push('Urutan alur cerita video');say('Ini urutan yang benar. Perhatikan alur: pembuka, kegiatan, karya, ajakan, lalu penutup.');G2.sl=[0,1,2,3,4];setTimeout(()=>{r2();say('Ini urutan yang benar. Perhatikan alurnya.');lvEnd(2,0,Wk[2])},1800)}
else say('Ada klip yang belum pas. Petunjuk: '+bad.slice(0,2).map(i=>SC[G2.sl[i]][3]).join(' '))}

// Level 3
let G3;const f1=v=>v.toFixed(1);
function L3(){G3={s:[0,20],ph:10,st:'A',n:0,p:0,w:[]};r3()}
const bx=v=>v/20*100+'%';
function r3(){const g=G3,A_=g.st=='A';
show(`${bar('Level 3')}<p><b>Trim dan Split.</b> ${A_?'Tahap A: pangkas klip 20 detik agar dimulai di detik 3,0 dan berakhir di detik 17,0.':g.st=='B'?'Tahap B: geser playhead lalu tekan Split agar bagian pertama berdurasi 6,0 detik.':g.st=='C'?'Tahap C: pilih format ekspor yang benar.':'Selesai!'}</p>
<div class="bar3" id="bar"><div class="clip" id="c1"></div><div class="clip" id="c2b" style="display:none"></div>${A_?'<div class="h3" id="hl"></div><div class="h3" id="hr"></div>':''}${g.st=='B'?'<div class="h3 p" id="hp"></div>':''}${[0,5,10,15,20].map(t=>`<span class="tk" style="left:${bx(t)}">${t}</span>`).join('')}</div>
<div class="fb" id="fb"></div><p class="hint" id="rd"></p><div id="act"></div><div id="end"></div>`);
if(g.st=='A'||g.st=='B')ui3();else if(g.st=='C')fmt()}
function ui3(){const g=G3;const c=$('#c1'),a=g.s;
if(g.st=='A'){c.style.left=bx(a[0]);c.style.width=(a[1]-a[0])/20*100+'%';$('#hl').style.left=bx(a[0]);$('#hr').style.left=bx(a[1]);$('#rd').textContent=`Mulai ${f1(a[0])} dtk · Akhir ${f1(a[1])} dtk · Durasi ${f1(a[1]-a[0])} dtk`;$('#act').innerHTML='<button class="btn pr" onclick="ck3()">Periksa Trim</button>'}
else{c.style.left=bx(3);c.style.width=14/20*100+'%';$('#hp').style.left=bx(g.ph);$('#rd').textContent=`Playhead di detik ${f1(g.ph)} · Bagian 1: ${f1(g.ph-3)} dtk · Bagian 2: ${f1(17-g.ph)} dtk`;$('#act').innerHTML='<button class="btn pr" onclick="ck3()">✂ Split</button>'}
const tm=(el,fn)=>{el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{const r=$('#bar').getBoundingClientRect();fn(Math.round(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width))*200)/10);ui3()};el.onpointerup=()=>{el.onpointermove=null}}};
if(g.st=='A'){tm($('#hl'),v=>g.s[0]=Math.min(v,g.s[1]-1));tm($('#hr'),v=>g.s[1]=Math.max(v,g.s[0]+1))}else tm($('#hp'),v=>g.ph=Math.min(16,Math.max(4,v)))}
function ck3(){const g=G3,n=++g.n,full=g.st=='A'?15:15;let ok,h;
if(g.st=='A'){const[a,b]=g.s;ok=Math.abs(a-3)<=.5&&Math.abs(b-17)<=.5;h=Math.abs(a-3)>.5?(a<3?'Awal klip masih terlalu panjang. Geser pegangan kiri ke kanan.':'Pegangan kiri kebablasan. Geser sedikit ke kiri.'):(b>17?'Akhir klip masih terlalu panjang. Geser pegangan kanan ke kiri.':'Pegangan kanan kebablasan. Geser sedikit ke kanan.')}
else{const f=g.ph-3;ok=Math.abs(f-6)<=.5;h=f<6?'Bagian pertama terlalu pendek. Geser playhead ke kanan.':'Bagian pertama terlalu panjang. Geser playhead ke kiri.'}
if(ok){g.p+=n==1?full:7;say('Tepat!');nx3()}else if(n>=2){g.w.push(g.st=='A'?'Trim klip':'Split klip');Wk[3].push(g.st=='A'?'Trim klip':'Split klip');if(g.st=='A')g.s=[3,17];else g.ph=9;ui3();say('Ini posisi yang benar. Perhatikan angka durasinya.');setTimeout(nx3,1500)}else say('Belum pas. Petunjuk: '+h+' (toleransi 0,5 detik)')}
function nx3(){const g=G3;g.n=0;if(g.st=='A'){g.st='B';r3()}else if(g.st=='B'){const c=$('#c1'),d=$('#c2b'),p=g.ph;c.style.left=bx(3);c.style.width=(p-3)/20*100-1+'%';d.style.display='block';d.style.left=bx(p)+'';d.style.width=(17-p)/20*100-1+'%';$('#hp').remove();$('#act').innerHTML='';say('Klip terbelah jadi dua bagian!');setTimeout(()=>{g.st='C';r3()},1300)}}
function fmt(){const g=G3,F=['PNG','JPG','MP4 Video','PDF','PPTX'];$('#bar').style.display='none';$('#act').innerHTML=F.map(f=>`<button class="opt" onclick="ex(this,'${f}')"><b>${L[F.indexOf(f)]}</b>${f}</button>`).join('')}
function ex(b,f){const g=G3;if(f=='MP4 Video'){g.p+=g.n?5:10;b.classList.add('ok');say('Benar! MP4 Video menyimpan gambar bergerak beserta suaranya.');lvEnd(3,g.p,g.w);return}
g.n++;b.classList.add('bad');b.disabled=true;if(g.n>=2){g.w.push('Format ekspor video');Wk[3].push('Format ekspor video');const m=[...$('#act').children].find(x=>x.textContent.includes('MP4'));m.classList.add('ok');say('Jawaban yang benar: MP4 Video.');lvEnd(3,g.p,g.w)}else say('Belum tepat. Petunjuk: videomu bergerak dan bersuara.')}
gate();
</script></body></html>
